[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hin-iot"
version = "1.0.0"
description = "Heterogeneous information networks for cross-architecture IoT malware detection under temporal shift"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Dac-Tot Tran" }, { name = "Anh-Tu Tran" },
  { name = "Khuong Nguyen-An" }, { name = "The-Dung Luong" },
]
dependencies = [
  "torch>=2.1", "torch_geometric>=2.4", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3",
  "scipy>=1.10", "lightgbm>=4.0", "imbalanced-learn>=0.11", "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["hin_iot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
